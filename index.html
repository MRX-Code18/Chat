<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta - Chat con amigos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 450px;
            padding: 40px;
        }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .tab {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }
        .form {
            display: none;
        }
        .form.active {
            display: block;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            background: #5a67d8;
        }
        .error {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 Conecta</h1>
        <div class="tab">
            <button class="tab-btn active" onclick="showTab('login')">Iniciar Sesión</button>
            <button class="tab-btn" onclick="showTab('register')">Registrarse</button>
        </div>

        <!-- Login -->
        <div id="loginForm" class="form active">
            <form id="login">
                <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
                <input type="password" id="loginPassword" placeholder="Contraseña" required>
                <button type="submit">Ingresar</button>
                <div id="loginError" class="error"></div>
            </form>
        </div>

        <!-- Registro -->
        <div id="registerForm" class="form">
            <form id="register">
                <input type="email" id="regEmail" placeholder="Correo electrónico" required>
                <input type="password" id="regPassword" placeholder="Contraseña (mínimo 6 caracteres)" required>
                <input type="text" id="regAlias" placeholder="Alias (nombre público)" required>
                <input type="text" id="regPronombres" placeholder="Pronombres (ej: él/ella/elle)" required>
                <input type="date" id="regFecha" required>
                <button type="submit">Crear cuenta</button>
                <div id="regError" class="error"></div>
            </form>
        </div>
    </div>

    <script>
        // ⚠️ CAMBIA ESTOS VALORES por los de tu Supabase ⚠️
        const SUPABASE_URL = 'https://jqcephrggkuiopxvqnlf.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxY2VwaHJnZ2t1aW9weHZxbmxmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNjU0NTMsImV4cCI6MjA5NTg0MTQ1M30.sltHDd2yGzQgwKgG8ye5eZ3wI-H9r_oBMsQbVHZI2vw';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showTab(tab) {
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (tab === 'login') {
                document.getElementById('loginForm').classList.add('active');
                document.querySelector('.tab-btn:first-child').classList.add('active');
            } else {
                document.getElementById('registerForm').classList.add('active');
                document.querySelector('.tab-btn:last-child').classList.add('active');
            }
        }

        // Registro
        document.getElementById('register').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const alias = document.getElementById('regAlias').value;
            const pronombres = document.getElementById('regPronombres').value;
            const fecha = document.getElementById('regFecha').value;

            // 1. Registrar usuario en Auth
            const { data: authData, error: authError } = await supabase.auth.signUp({
                email, password
            });

            if (authError) {
                document.getElementById('regError').innerText = authError.message;
                return;
            }

            // 2. Crear perfil
            const { error: profileError } = await supabase
                .from('profiles')
                .insert([{
                    id: authData.user.id,
                    alias: alias,
                    pronombres: pronombres,
                    fecha_nacimiento: fecha
                }]);

            if (profileError) {
                document.getElementById('regError').innerText = profileError.message;
            } else {
                alert('¡Registro exitoso! Ahora inicia sesión');
                showTab('login');
            }
        });

        // Login
        document.getElementById('login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const { error } = await supabase.auth.signInWithPassword({
                email, password
            });

            if (error) {
                document.getElementById('loginError').innerText = error.message;
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta - Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #e5ddd5;
            height: 100vh;
            display: flex;
        }
        .sidebar {
            width: 350px;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        .user-info {
            padding: 20px;
            background: #075e54;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #25d366;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .user-details {
            flex: 1;
        }
        .user-alias {
            font-weight: bold;
            font-size: 18px;
        }
        .logout-btn {
            background: #dc3545;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
        }
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            background: #f0f0f0;
            border: none;
            font-size: 16px;
        }
        .tab.active {
            background: white;
            border-bottom: 2px solid #075e54;
            font-weight: bold;
        }
        .search-box {
            padding: 15px;
            background: #f6f6f6;
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
        }
        .contacts-list, .groups-list {
            flex: 1;
            overflow-y: auto;
        }
        .contact-item, .group-item {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .contact-item:hover, .group-item:hover {
            background: #f5f5f5;
        }
        .contact-name, .group-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .contact-pronouns {
            font-size: 12px;
            color: #666;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 15px 20px;
            background: #075e54;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 20px;
            margin-bottom: 5px;
        }
        .message.sent {
            background: #dcf8c5;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }
        .message.received {
            background: white;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }
        .message-image {
            max-width: 200px;
            border-radius: 10px;
            cursor: pointer;
        }
        .message-time {
            font-size: 10px;
            color: #666;
            margin-top: 5px;
            text-align: right;
        }
        .chat-input {
            padding: 15px;
            background: #f0f0f0;
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
        }
        .chat-input button {
            padding: 12px 20px;
            background: #075e54;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
        .image-upload {
            background: #25d366;
            padding: 12px 15px;
            border-radius: 25px;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
        }
        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        .create-group-btn {
            margin: 10px;
            background: #075e54;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="user-info" id="userInfo">
            <div class="user-avatar">👤</div>
            <div class="user-details">
                <div class="user-alias" id="userAlias">Cargando...</div>
                <div class="user-pronouns" id="userPronouns"></div>
            </div>
            <div class="logout-btn" onclick="logout()">Salir</div>
        </div>
        <div class="tabs">
            <button class="tab active" onclick="switchTab('chats')">Chats</button>
            <button class="tab" onclick="switchTab('groups')">Grupos</button>
            <button class="tab" onclick="switchTab('requests')">Solicitudes</button>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Buscar por alias..." onkeyup="searchUsers()">
        </div>
        <div id="chatsList" class="contacts-list"></div>
        <div id="groupsList" class="groups-list" style="display:none;"></div>
        <div id="requestsList" class="groups-list" style="display:none;"></div>
        <button class="create-group-btn" onclick="showCreateGroupModal()">➕ Crear Grupo</button>
    </div>

    <div class="chat-area">
        <div class="chat-header" id="chatHeader">
            <span>Selecciona un chat</span>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div style="text-align:center; color:#666;">Selecciona un contacto o grupo para empezar a chatear</div>
        </div>
        <div class="chat-input" id="chatInput" style="display:none;">
            <input type="text" id="messageInput" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') sendMessage()">
            <label class="image-upload" id="imageUploadBtn">📷</label>
            <input type="file" id="imageFile" accept="image/*" style="display:none;">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <div id="groupModal" class="modal">
        <div class="modal-content">
            <h3>Crear Grupo</h3>
            <input type="text" id="groupName" placeholder="Nombre del grupo">
            <input type="text" id="groupPin" placeholder="PIN de acceso (4-6 dígitos)">
            <button onclick="createGroup()">Crear</button>
            <button onclick="closeModal()">Cancelar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
